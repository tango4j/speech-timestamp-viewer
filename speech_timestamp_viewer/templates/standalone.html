<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Speech timestamp viewer</title>
<style>
:root{color-scheme:light dark;--foreground:light-dark(#202124,#ededed);--background:light-dark(#fff,#171717);--border:light-dark(#ddd,#444);--primary:light-dark(#252525,#ededed);--viz-series-1:light-dark(#1967d2,#8ab4f8);--viz-series-2:light-dark(#b75005,#ffb16e);--viz-series-3:light-dark(#128059,#74cda5);--viz-series-4:light-dark(#8640ae,#d4a8ed);--viz-series-5:light-dark(#bd3040,#f8a0aa);--viz-series-6:light-dark(#887000,#e6d35e)}
body{margin:0;padding:24px;font:16px/1.5 system-ui,sans-serif;background:var(--background);color:var(--foreground)}
main{max-width:1000px;margin:auto}h2{font-size:1.3em;font-weight:500;margin:0 0 12px}.form-label{display:block}.form-select{box-sizing:border-box;width:100%;padding:10px;margin:6px 0 12px;font:inherit;color:inherit;background:var(--background);border:1px solid var(--border);border-radius:8px}.text-small{font-size:.875em}.viz-row{display:flex;flex-wrap:wrap;gap:6px}.btn{font:inherit;padding:8px 12px;border:0;border-radius:8px}.tabular-nums{font-variant-numeric:tabular-nums}button{cursor:pointer}details{margin-top:16px}button:focus-visible{outline:2px solid var(--foreground);outline-offset:2px}
</style>
</head>
<body><main>__FRAGMENT__</main></body>
</html>
